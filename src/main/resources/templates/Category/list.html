<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/layout}">
<head>
    <title>Danh sách Category</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="text-primary"><i class="fa-solid fa-list"></i> Danh sách danh mục</h2>
        <a th:href="@{/categories/create}" class="btn btn-success">
            <i class="fa-solid fa-plus"></i> Thêm mới
        </a>
    </div>

    <!-- Hiển thị thông báo (nếu có) -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Thanh tìm kiếm -->
    <form th:action="@{/categories}" method="get" class="mb-4">
        <div class="input-group w-50">
            <input type="text" name="keyword" class="form-control" placeholder="Tìm kiếm theo tên..." th:value="${keyword}">
            <button class="btn btn-outline-primary" type="submit">
                <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
            </button>
            <a th:href="@{/categories}" class="btn btn-outline-secondary" th:if="${keyword != null and !keyword.isEmpty()}">Xóa</a>
        </div>
    </form>

    <!-- Bảng danh sách -->
    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
            <thead class="table-primary text-center">
            <tr>
                <th width="5%">ID</th>
                <th width="30%">Tên danh mục</th>
                <th width="45%">Mô tả</th>
                <th width="20%">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${categoryPage.empty}">
                <td colspan="4" class="text-center text-muted py-3">Không tìm thấy danh mục nào.</td>
            </tr>
            <tr th:each="cat : ${categoryPage.content}">
                <td class="text-center fw-bold" th:text="${cat.id}"></td>
                <td th:text="${cat.name}"></td>
                <td th:text="${cat.description}"></td>
                <td class="text-center">
                    <a th:href="@{/categories/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-warning">
                        <i class="fa-solid fa-pen-to-square"></i> Sửa
                    </a>
                    <a th:href="@{/categories/delete/{id}(id=${cat.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');">
                        <i class="fa-solid fa-trash"></i> Xóa
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Phân trang -->
    <nav th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/categories(page=${currentPage - 1}, keyword=${keyword})}">Trang trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i ? 'active' : ''}">
                <a class="page-link" th:href="@{/categories(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/categories(page=${currentPage + 1}, keyword=${keyword})}">Trang sau</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
